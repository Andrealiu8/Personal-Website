name: Deploy to GitHub Pages

on:
  # Every push to main publishes the site.
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# The base href baked into the build must match the path the site is served
# from. For a project site that is the repository name; switch this to "/" if a
# custom domain is ever added (and add a CNAME file in site/public/).
env:
  BASE_HREF: /Personal-Website/

# Only needs to write the gh-pages branch. Publishing happens by pushing a
# branch rather than through the Pages deployment API, so this does not need
# the pages/id-token permissions.
permissions:
  contents: write

# Let a newer push cancel an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build -- --base-href=$BASE_HREF

      # GitHub Pages has no server-side routing: a request for a path it has no
      # file for returns 404.html. Serving the prerendered index there keeps
      # deep links working instead of showing GitHub's error page.
      - name: Add 404 fallback
        run: cp dist/site/browser/index.html dist/site/browser/404.html

      # Publish the built output as the sole commit on gh-pages. It is an
      # orphan commit force-pushed each time, so the branch never accumulates
      # history and the repository does not grow with every deploy.
      #
      # dist/ is gitignored, so `git init` here creates a repository that is
      # independent of the checkout above and contains only the built site.
      - name: Publish to gh-pages
        working-directory: site/dist/site/browser
        run: |
          test -f .nojekyll || { echo "::error::.nojekyll missing from build output"; exit 1; }
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
          echo "Published $(git ls-files | wc -l) files to gh-pages"
