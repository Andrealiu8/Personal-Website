<section class="section about" id="about" aria-labelledby="about-title">
  <div class="container about__grid">
    <div class="about__head" appReveal>
      <p class="section__label">{{ content.label }}</p>
      <h2 class="section__title" id="about-title">{{ content.title }}</h2>
    </div>

    <!-- Second in source order so the portrait lands between the title and the
         bio on a phone, where the grid collapses to one column. -->
    <div class="about__portrait" appReveal>
      <img
        class="about__img"
        ngSrc="about-portrait"
        ngSrcset="600w, 900w, 1200w"
        sizes="(min-width: 768px) 34vw, 18rem"
        width="2800"
        height="4200"
        [alt]="content.photoAlt"
      />
    </div>

    <div class="about__body" appReveal>
      @for (paragraph of content.paragraphs; track $index) {
        <p>{{ paragraph }}</p>
      }
    </div>
  </div>

  <div class="container">
    <ul class="about__highlights" appReveal>
      @for (item of content.highlights; track item.value) {
        <li class="highlight">
          <p class="highlight__value">{{ item.value }}</p>
          <p class="highlight__detail">{{ item.detail }}</p>
        </li>
      }
    </ul>
  </div>
</section>
