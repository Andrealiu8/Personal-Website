<section class="hero" [class.hero--alt]="variant() === 'alt'" id="home" aria-labelledby="hero-name">
  <div class="hero__media">
    <img
      class="hero__img"
      [ngSrc]="photo().src"
      [ngSrcset]="photo().srcset"
      sizes="100vw"
      fill
      priority
      [alt]="photo().alt"
    />
  </div>

  <!-- Guarantees contrast for the light type regardless of what the photo
       does behind it. Decorative, so hidden from assistive tech. -->
  <div class="hero__scrim" aria-hidden="true"></div>

  <div class="hero__body">
    <p class="hero__role">{{ content.role }}</p>
    <h1 class="hero__name" id="hero-name">{{ content.name }}</h1>
    <p class="hero__tagline">{{ content.tagline }}</p>

    <div class="hero__actions">
      <a class="btn btn--primary" [href]="content.primaryCta.target">{{
        content.primaryCta.label
      }}</a>
      <a class="btn btn--ghost" [href]="content.secondaryCta.target">{{
        content.secondaryCta.label
      }}</a>
    </div>
  </div>
</section>
